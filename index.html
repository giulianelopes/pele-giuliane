<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pele Giuliane"><meta name="theme-color" content="#fff7ee"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json"><title>Pele Giuliane</title><style>
:root{--card:#fffdf9;--text:#3b312c;--muted:#856f55;--line:#eadcca;--gold:#c49a63;--gold2:#a88958;--green:#71966e;--danger:#955c4d}*{box-sizing:border-box;max-width:100%;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overflow-x:hidden;scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:linear-gradient(180deg,#fffaf5,#f2e4d4);color:var(--text)}button{font:inherit}.app{width:100%;max-width:430px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(112px + env(safe-area-inset-bottom))}.header{position:sticky;top:0;z-index:20;margin:0 -14px;padding:14px;background:rgba(255,247,238,.97);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.kicker{font-size:11px;color:var(--gold2);font-weight:900;text-transform:uppercase;letter-spacing:.08em}h1{font-size:34px;line-height:1;margin:4px 0;letter-spacing:-.04em}.subtitle{font-size:15px;color:var(--muted);font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;margin:14px 0;box-shadow:0 14px 36px rgba(90,60,30,.07);overflow:hidden}.tab{display:none}.tab.active{display:block}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.day{border:1px solid var(--line);border-radius:18px;background:white;padding:9px 4px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px}.day b{font-size:15px}.day small{font-size:9.5px;line-height:1.05;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.day.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:white;border-color:transparent;box-shadow:0 10px 22px rgba(168,137,88,.25)}.dayTitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}.dayTitle span{font-size:30px;font-weight:950;letter-spacing:-.04em}.dayTitle small{font-size:13px;font-weight:900;background:#f2e5d4;color:var(--gold2);border-radius:999px;padding:7px 11px}.hint{font-size:14px;line-height:1.35;color:#76503f;background:#fff4ed;border:1px solid #efcfba;border-radius:16px;padding:11px;margin-bottom:12px;overflow-wrap:anywhere}.progressText{font-size:13px;color:var(--muted);font-weight:900;margin:4px 0 6px}.progress{height:10px;background:#f0e4d4;border-radius:999px;overflow:hidden;margin-bottom:16px}.progressFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--green));transition:.25s}.section{font-size:20px;font-weight:950;color:var(--gold2);letter-spacing:.08em;text-transform:uppercase;margin:18px 0 10px}.check{width:100%;min-height:58px;border:1px solid var(--line);background:white;border-radius:18px;padding:13px;display:flex;align-items:center;gap:12px;margin:9px 0;text-align:left;color:var(--text)}.box{width:30px;height:30px;border:2px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 30px;font-weight:950}.check span:last-child{font-size:16px;line-height:1.25;font-weight:800;overflow-wrap:anywhere}.check.done{background:#eef7ee;border-color:#b8d3b8;color:#456b45}.check.done .box{background:var(--green);border-color:var(--green);color:white}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.action{border:0;border-radius:17px;padding:14px 10px;font-weight:950;color:var(--gold2);background:#efe3d2;min-height:50px}.action.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:white}.action.full{grid-column:1/-1}.action.active{background:#dfeedd;color:#486f48;border:1px solid #bdd6b8}.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}.filter{border:1px solid var(--line);border-radius:999px;background:white;color:var(--muted);font-weight:900;padding:10px 8px;line-height:1.05}.filter.active{background:var(--text);color:white;border-color:var(--text)}.products{display:grid;grid-template-columns:1fr;gap:12px}.product{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden}.productImg{height:185px;background:white;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);padding:10px}.productImg img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.productInfo{padding:13px 14px 15px}.tag,.brand{font-size:11px;color:var(--gold2);font-weight:950;letter-spacing:.06em;text-transform:uppercase}.product h3{font-size:20px;line-height:1.12;margin:6px 0 4px;letter-spacing:-.02em;overflow-wrap:anywhere}.product p{font-size:14px;line-height:1.35;margin:7px 0 0;overflow-wrap:anywhere}.tip{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.tip h3{font-size:16px;margin:0 0 6px;color:var(--gold2)}.tip p{font-size:14px;line-height:1.38;margin:0}.tip.danger h3{color:var(--danger)}.mind{background:#fff4ed;border:1px solid #efcfba;border-radius:16px;padding:12px;font-size:14px;line-height:1.4;margin:9px 0;color:#76503f;font-weight:700}.chartBar{margin:14px 0}.barLabel{display:flex;justify-content:space-between;font-size:14px;font-weight:900;margin-bottom:7px}.barContainer{height:24px;background:#e8dcc8;border-radius:999px;overflow:hidden}.barFill{height:100%;background:linear-gradient(90deg,#ffb8a0,#c49a63);border-radius:999px;color:white;font-weight:950;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.25s}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,248,242,.97);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:50;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.bottomInner{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.bottom button{text-align:center;text-decoration:none;border-radius:15px;padding:12px 3px;font-weight:950;background:white;color:var(--gold2);border:1px solid var(--line);font-size:13px}.bottom button.active{color:white;background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent}
</style></head><body><div class="app"><header class="header"><div class="kicker">Rotina de colágeno & firmeza 40+</div><h1>Pele Giuliane</h1><div class="subtitle">Checklist diário de skincare</div></header>
<section class="tab active" id="rotina"><div class="card"><nav class="days" id="days"></nav><div class="dayTitle" id="dayTitle"></div><div class="hint" id="hint"></div><div class="progressText" id="progressText">0/0 concluídos</div><div class="progress"><div class="progressFill" id="progressFill"></div></div><div class="section">☀️ Manhã</div><div id="amList"></div><div class="section">🌙 Noite</div><div id="pmList"></div><div class="actions"><button class="action primary" onclick="renderDay(dayNames[new Date().getDay()])">Ver hoje</button><button class="action" onclick="clearDay()">Limpar</button><button class="action full" id="sensitive" onclick="toggleSensitive()">Modo pele sensível</button></div></div></section>
<section class="tab" id="produtos"><div class="card"><div class="section">Meus produtos</div><div class="filters"><button class="filter active" data-filter="Todos" onclick="renderProducts('Todos')">Todos</button><button class="filter" data-filter="Manhã" onclick="renderProducts('Manhã')">Manhã</button><button class="filter" data-filter="LED + reparo" onclick="renderProducts('LED + reparo')">LED + reparo</button><button class="filter" data-filter="Tratamentos" onclick="renderProducts('Tratamentos')">Tratamentos</button><button class="filter" data-filter="Barreira" onclick="renderProducts('Barreira')">Barreira</button></div><div class="products" id="products"></div></div></section>
<section class="tab" id="dicas"><div class="card"><div class="section">O que fazer</div><div id="tipsDo"></div><div class="section">O que não fazer</div><div id="tipsDont"></div><div class="section">Mindset</div><div id="tipsMindset"></div></div></section>
<section class="tab" id="progresso"><div class="card"><div class="section">Progresso da semana</div><div id="weekChart"></div><div class="hint">📊 Barras mostram quanto % você completou cada dia. O progresso reinicia automaticamente todo domingo.</div></div></section></div>
<nav class="bottom"><div class="bottomInner"><button class="active" data-tab="rotina">Rotina</button><button data-tab="produtos">Produtos</button><button data-tab="dicas">Dicas</button><button data-tab="progresso">Progresso</button></div></nav>
<script>
const products=[{"name": "Zero Pore Pad", "brand": "Medicube", "when": "Manhã e noite · conforme rotina", "group": "Tratamentos", "img": "zero-pore-pad.png", "note": "Substitui o Tônico AL-7. Tem AHA/BHA, pantenol, alantoína e hialuronato. Use sem exagero e evite somar com muita esfoliação."}, {"name": "Eye Care", "brand": "Care", "when": "Manhã e noite", "group": "Manhã", "img": "eye-care.png", "note": "Cuidado leve para a área dos olhos. Aplique antes de cremes mais densos e sem esfregar."}, {"name": "Vitamina C 20", "brand": "Adcos Derma Complex", "when": "Manhã", "group": "Manhã", "img": "vitamina-c.jpg", "note": "Antioxidante, luminosidade e apoio ao colágeno. Usar antes do protetor solar."}, {"name": "Collagen Glow Booster", "brand": "Medicube", "when": "Manhã · opcional", "group": "Manhã", "img": "medicube-serum.jpg", "note": "Glow e hidratação. Use antes do protetor solar."}, {"name": "UV Aqua Rich SPF 50+", "brand": "Bioré", "when": "Manhã · obrigatório", "group": "Manhã", "img": "biore.jpg", "note": "Passo essencial para preservar colágeno e evitar manchas."}, {"name": "Contour Face LED", "brand": "Omnilux", "when": "Noite LED", "group": "LED + reparo", "img": "omnilux.jpg", "note": "Use com pele limpa e seca. Evite usar ácidos imediatamente antes."}, {"name": "Super Pró-Colágeno", "brand": "Sallve", "when": "Após LED ou em noites de reparo", "group": "LED + reparo", "img": "sallve.jpg", "note": "Peptídeos 10%, Matrixyl, peptídeo de cobre e ácido hialurônico. Evite usar junto com ácidos fortes e tretinoína."}, {"name": "Azelan Gel 150 mg/g", "brand": "Ácido azelaico", "when": "Noite Azelan", "group": "Tratamentos", "img": "azelan.jpg", "note": "Para acne, manchas e inflamação. Evite misturar com Vitanol na mesma noite."}, {"name": "Vitanol-A 0,1%", "brand": "Tretinoína", "when": "Retinoide · 1x/semana", "group": "Tratamentos", "img": "vitanol.jpg", "note": "Renovação e estímulo de colágeno. Use pouca quantidade e proteja a barreira."}, {"name": "Cicaplast Baume B5", "brand": "La Roche-Posay", "when": "Barreira", "group": "Barreira", "img": "cicaplast.jpg", "note": "Reparo de barreira em dias de sensibilidade, ressecamento ou descamação."}];
const schedule={"Segunda": {"type": "LED + reparo", "am": ["Zero Pore Pad", "Vitamina C 20", "Medicube Collagen", "Eye Care", "Protetor Bioré"], "pm": ["Omnilux 10 min", "Sallve Super Pró-Colágeno", "Eye Care", "Cicaplast se necessário"]}, "Terça": {"type": "Tretinoína", "am": ["Zero Pore Pad", "Vitamina C 20", "Medicube Collagen", "Eye Care", "Protetor Bioré"], "pm": ["Vitanol-A 0,1%", "Eye Care", "Cicaplast"]}, "Quarta": {"type": "Reparo", "am": ["Zero Pore Pad", "Vitamina C 20", "Medicube Collagen", "Eye Care", "Protetor Bioré"], "pm": ["Sallve Super Pró-Colágeno", "Eye Care", "Cicaplast se necessário"]}, "Quinta": {"type": "LED + reparo", "am": ["Zero Pore Pad", "Vitamina C 20", "Medicube Collagen", "Eye Care", "Protetor Bioré"], "pm": ["Omnilux 10 min", "Sallve Super Pró-Colágeno", "Eye Care", "Cicaplast se necessário"]}, "Sexta": {"type": "Azelan", "am": ["Zero Pore Pad", "Vitamina C 20", "Medicube Collagen", "Eye Care", "Protetor Bioré"], "pm": ["Azelan", "Eye Care", "Cicaplast se necessário"]}, "Sábado": {"type": "Descanso", "am": ["Zero Pore Pad", "Vitamina C 20", "Medicube Collagen", "Eye Care", "Protetor Bioré"], "pm": ["Hidratação simples", "Eye Care", "Cicaplast se necessário"]}, "Domingo": {"type": "LED + reparo", "am": ["Zero Pore Pad", "Vitamina C 20", "Medicube Collagen", "Eye Care", "Protetor Bioré"], "pm": ["Omnilux 10 min", "Sallve Super Pró-Colágeno", "Eye Care", "Cicaplast se necessário"]}};
const tipsDo=[["Use o Zero Pore Pad com moderação", "Ele substitui o Tônico AL-7, mas ainda tem AHA/BHA. Use conforme a rotina e reduza se houver ardência ou ressecamento."], ["Proteja a área dos olhos", "O Eye Care pode entrar de manhã e à noite, sempre com aplicação delicada, sem fricção."], ["Omnilux em pele limpa e seca", "Nos dias de LED, faça limpeza, use a máscara e depois entre com produtos de reparo."], ["Protetor solar é tratamento", "A fotoproteção sustenta todo o resultado anti-idade e ajuda a proteger o colágeno."], ["Cicaplast é seu freio de segurança", "Use quando perceber ardência, sensibilidade, descamação ou repuxamento."], ["Acompanhe o progresso semanal", "A aba Progresso mostra a constância da semana e reinicia automaticamente aos domingos."]];
const tipsDont=[["Não use esfoliação extra", "Com Zero Pore Pad, evite scrubs, peelings ou outros ácidos sem necessidade."], ["Não misture Vitanol com Azelan", "Mantenha a tretinoína separada do Azelan para reduzir irritação."], ["Não use ácido antes da Omnilux se a pele estiver sensível", "Se houver ardência, use LED em pele limpa e foque em reparo depois."], ["Não ignore sinais de barreira comprometida", "Vermelhidão persistente, ardência ou descamação pedem pausa nos ativos."]];
const tipsMindset=["Mais constância, menos agressão.", "Pele bonita depende de barreira íntegra.", "Resultados de firmeza aparecem com semanas de regularidade."];
const dayNames=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];let selectedDay=dayNames[new Date().getDay()];let sensitiveMode=localStorage.getItem("pele_Giuliane_sensitive")==="1";
function sundayKey(){const d=new Date();const s=new Date(d);s.setDate(d.getDate()-d.getDay());return s.toISOString().slice(0,10)}
function keyFor(day,period,item){return "pele_Giuliane_v4_"+sundayKey()+"_"+day+"_"+period+"_"+item}
function getItems(day){const s=schedule[day];const pm=sensitiveMode?["Pele sensível: pausar ácidos, retinoide e LED","Hidratação simples","Eye Care","Cicaplast","Protetor solar reforçado no dia seguinte"]:s.pm;return[...s.am.map(i=>["am",i]),...pm.map(i=>["pm",i])]}
function updateProgress(day){const items=getItems(day);const done=items.filter(([p,i])=>localStorage.getItem(keyFor(day,p,i))==="1").length;const pct=items.length?Math.round(done/items.length*100):0;document.getElementById("progressText").textContent=`${done}/${items.length} concluídos`;document.getElementById("progressFill").style.width=pct+"%";renderWeekChart()}
function toggleCheck(day,period,item,el){const k=keyFor(day,period,item);const next=localStorage.getItem(k)!=="1";localStorage.setItem(k,next?"1":"0");el.classList.toggle("done",next);el.querySelector(".box").textContent=next?"✓":"";updateProgress(day)}
function checkBtn(day,period,item){const done=localStorage.getItem(keyFor(day,period,item))==="1";return`<button class="check ${done?"done":""}" onclick="toggleCheck('${day}','${period}','${item}',this)"><span class="box">${done?"✓":""}</span><span>${item}</span></button>`}
function hint(day){const t=schedule[day].type;if(sensitiveMode)return"Modo pele sensível: pausa em ácidos, retinoide e LED. Foque em hidratação, Eye Care, Cicaplast e protetor.";if(t.includes("LED"))return"Hoje é dia de LED: pele limpa e seca; depois, reparo.";if(t.includes("Tretinoína"))return"Hoje é dia de tretinoína: pouca quantidade e barreira protegida.";if(t.includes("Azelan"))return"Hoje é dia de Azelan: evite misturar com Vitanol.";return"Hoje é dia de reparo/descanso: hidratação e barreira."}
function renderDay(day){selectedDay=day;document.querySelectorAll(".day").forEach(b=>b.classList.toggle("active",b.dataset.day===day));const s=schedule[day];const pm=sensitiveMode?["Pele sensível: pausar ácidos, retinoide e LED","Hidratação simples","Eye Care","Cicaplast","Protetor solar reforçado no dia seguinte"]:s.pm;document.getElementById("dayTitle").innerHTML=`<span>${day}</span><small>${s.type}</small>`;document.getElementById("hint").textContent=hint(day);document.getElementById("amList").innerHTML=s.am.map(i=>checkBtn(day,"am",i)).join("");document.getElementById("pmList").innerHTML=pm.map(i=>checkBtn(day,"pm",i)).join("");updateProgress(day)}
function clearDay(){getItems(selectedDay).forEach(([p,i])=>localStorage.removeItem(keyFor(selectedDay,p,i)));renderDay(selectedDay)}
function toggleSensitive(){sensitiveMode=!sensitiveMode;localStorage.setItem("pele_Giuliane_sensitive",sensitiveMode?"1":"0");document.getElementById("sensitive").classList.toggle("active",sensitiveMode);renderDay(selectedDay)}
function renderProducts(filter="Todos"){document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter));const list=filter==="Todos"?products:products.filter(p=>p.group===filter);document.getElementById("products").innerHTML=list.map(p=>`<article class="product"><div class="productImg"><img src="${p.img}" alt="${p.name}"></div><div class="productInfo"><div class="tag">${p.when}</div><h3>${p.name}</h3><div class="brand">${p.brand}</div><p>${p.note}</p></div></article>`).join("")}
function renderTips(){document.getElementById("tipsDo").innerHTML=tipsDo.map(([t,b])=>`<article class="tip"><h3>${t}</h3><p>${b}</p></article>`).join("");document.getElementById("tipsDont").innerHTML=tipsDont.map(([t,b])=>`<article class="tip danger"><h3>${t}</h3><p>${b}</p></article>`).join("");document.getElementById("tipsMindset").innerHTML=tipsMindset.map(t=>`<p class="mind">✨ ${t}</p>`).join("")}
function weekStats(){return dayNames.map(day=>{const items=getItems(day);const done=items.filter(([p,i])=>localStorage.getItem(keyFor(day,p,i))==="1").length;return{name:day,percent:items.length?Math.round(done/items.length*100):0}})}
function renderWeekChart(){const el=document.getElementById("weekChart");if(!el)return;el.innerHTML=weekStats().map(d=>`<div class="chartBar"><div class="barLabel"><span>${d.name}</span><span>${d.percent}%</span></div><div class="barContainer"><div class="barFill" style="width:${Math.max(d.percent,3)}%">${d.percent>15?d.percent+"%":""}</div></div></div>`).join("")}
function switchTab(tab){document.querySelectorAll(".tab").forEach(s=>s.classList.toggle("active",s.id===tab));document.querySelectorAll(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="progresso")renderWeekChart();window.scrollTo({top:0,behavior:"smooth"})}
function init(){document.getElementById("days").innerHTML=Object.keys(schedule).map(d=>`<button class="day" data-day="${d}" onclick="renderDay('${d}')"><b>${d.slice(0,3)}</b><small>${schedule[d].type}</small></button>`).join("");document.getElementById("sensitive").classList.toggle("active",sensitiveMode);document.querySelectorAll(".bottom button").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));renderDay(selectedDay);renderProducts();renderTips();renderWeekChart()}
window.addEventListener("DOMContentLoaded",init);
</script></body></html>
